# Daily price check. The schedule (08:00 Europe/Warsaw) is added in phase 5;
# for now the workflow runs on demand only.
name: daily-price-check

on:
  workflow_dispatch:
    inputs:
      no_history:
        description: "Trial run: update Sheets but do not append to the history sheet"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price monitor
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.main ${{ inputs.no_history && '--no-history' || '' }} 2>&1 | tee run.log

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: |
            run.log
            data/products_*.json
            data/site_status.json
            data/match_review.json
          retention-days: 14
