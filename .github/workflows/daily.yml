# Daily price check.
#
# Schedule: GitHub cron runs in UTC and ignores daylight saving time.
# 07:17 UTC = 08:17 in Warsaw in winter (CET), 09:17 in summer (CEST).
# Not on :00 — scheduled runs at the top of the hour are often delayed.
name: daily-price-check

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      no_history:
        description: "Trial run: update Sheets but do not append to the history sheet"
        type: boolean
        default: false

permissions:
  contents: write  # the run commits the refreshed caches in data/

concurrency:
  group: daily-price-check  # never two runs at once (they share data/ and the sheet)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price monitor
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m src.main ${{ inputs.no_history && '--no-history' || '' }} 2>&1 | tee run.log

      # Caches are committed even after a partial failure: identifiers fetched
      # and site health recorded are still valid.
      - name: Commit refreshed caches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/product_ids.json data/fx_rates.json data/site_status.json data/offers_latest.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh caches $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify Telegram about a failed run
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f data/.failure_notified ]; then
            echo "The monitor already reported this failure"
            exit 0
          fi
          curl -sS --fail-with-body -o /dev/null \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ EU price monitor: the daily run failed. Log: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results
          path: |
            run.log
            data/products_*.json
            data/site_status.json
            data/match_review.json
            data/alert_message.txt
          retention-days: 14
